name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it publishes.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: a new release can add checks and break CI on unchanged code.
          version: v2.15.0
      - run: make test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # No QEMU needed: Go cross-compiles on the build platform and the final stage has no RUN steps.
      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64) and check size
        run: |
          docker buildx build --load --platform linux/amd64 -t devforth/exception-monitoring:ci .
          make image-size VERSION=ci

      - name: Build image (arm64)
        run: docker buildx build --platform linux/arm64 .
