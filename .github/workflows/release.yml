name: Release

# Pushing a tag like v1.2.3 publishes devforth/exception-monitoring:1.2.3,
# :1.2 and :latest for amd64 and arm64 to Docker Hub.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (an access token with Read & Write scope).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # Tests, lint and the image size check, as on every push.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      # No QEMU needed: Go cross-compiles on the build platform and the final stage has no RUN steps.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: devforth/exception-monitoring
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest only for releases, not for pre-releases like v1.0.0-rc.1
          flavor: |
            latest=auto

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
